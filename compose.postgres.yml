services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: battleness
      POSTGRES_USER: battleness
      POSTGRES_PASSWORD: battleness
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U battleness -d battleness"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - battleness-postgres-data:/var/lib/postgresql/data

volumes:
  battleness-postgres-data:
